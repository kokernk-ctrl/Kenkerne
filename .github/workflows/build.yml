name: Build APK (Release assinado)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decodificar keystore dos secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kenkern-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/kenkern-release.jks" >> "$GITHUB_ENV"
            echo "Keystore decodificado."
          else
            echo "KEYSTORE_BASE64 ausente: o release será assinado com a chave debug."
          fi

      - name: Testes de unidade (raio de câmera / projeção do gizmo)
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenkern-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
