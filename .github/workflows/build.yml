name: Build e validar APK Android

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # B3 (v0.1.17): NDK e CMake com VERSÃO FIXADA — as mesmas do
      # app/build.gradle.kts (ndkVersion 27.3.13750724 · CMake 3.22.1).
      - name: Instalar NDK 27.3.13750724 e CMake 3.22.1 (fixados)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null 2>&1 || \
            yes | sdkmanager "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
          echo "NDK instalado:" && ls "$ANDROID_HOME/ndk" || true
          echo "CMake instalado:" && ls "$ANDROID_HOME/cmake" || true

      - name: Exigir assinatura de release para tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Tags v* exigem toda a configuração de assinatura de release."
            exit 1
          fi

      - name: Decodificar keystore dos secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kenkern-release.jks"
            test -s "$RUNNER_TEMP/kenkern-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/kenkern-release.jks" >> "$GITHUB_ENV"
            echo "Keystore decodificado."
          else
            echo "Sem keystore: build não-tag usa a chave debug local."
          fi

      # T0.1 (adendo v4 — DECISIONS #27): nenhuma tela com texto literal em
      # Text("...")/contentDescription e paridade de chaves en/pt.
      - name: Checagem de i18n (sem literais em telas; paridade en/pt)
        run: bash scripts/check_i18n.sh

      - name: Testes de unidade (raio de câmera / projeção do gizmo)
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Lint release (erros bloqueiam o gate)
        run: ./gradlew lintRelease --stacktrace

      - name: assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KENKERN_REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleRelease --stacktrace

      # E1 (v0.1.18): TODA `external fun` do Kotlin precisa de símbolo JNI na
      # libkenkern.so DO APK RELEASE — llvm-nm -D --defined-only confere a
      # lista (o bug E1 foi símbolo com nome que não casava: "No implementation
      # found" com a .so carregada). Falha aqui bloqueia o build.
      - name: "E1: símbolos JNI da .so do APK (llvm-nm -D --defined-only)"
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk)"
          rm -rf /tmp/apk-e1 && mkdir -p /tmp/apk-e1
          unzip -q "$APK" -d /tmp/apk-e1
          NM="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          [ -x "$NM" ] || NM=nm
          bash scripts/check_jni_symbols.sh /tmp/apk-e1/lib/arm64-v8a/libkenkern.so "$NM"

      - name: Publicar APK como artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kenkern-android-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
