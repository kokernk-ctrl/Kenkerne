name: Build release Android assinado

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Instalar NDK 27.3.13750724 e CMake 3.22.1 (fixados)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null 2>&1 || \
            yes | sdkmanager "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Exigir configuração de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Tags v* exigem toda a configuração de assinatura de release."
            exit 1
          fi

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kenkern-release.jks"
          test -s "$RUNNER_TEMP/kenkern-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/kenkern-release.jks" >> "$GITHUB_ENV"

      - name: Sintaxe e regressão dos scripts
        run: |
          bash -n scripts/check_i18n.sh
          bash -n scripts/test_check_i18n.sh
          bash scripts/test_check_i18n.sh

      - name: Checagem de i18n
        run: bash scripts/check_i18n.sh

      - name: Testes JVM
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Lint release
        run: ./gradlew lintRelease --stacktrace

      - name: assembleRelease assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KENKERN_REQUIRE_RELEASE_SIGNING: 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Validar símbolos JNI da .so do APK
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk)"
          python3 scripts/check_android_apk.py "$APK"
          mkdir -p "$RUNNER_TEMP/apk-jni"
          unzip -q "$APK" -d "$RUNNER_TEMP/apk-jni"
          NM="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          [ -x "$NM" ] || NM=nm
          bash scripts/check_jni_symbols.sh "$RUNNER_TEMP/apk-jni/lib/arm64-v8a/libkenkern.so" "$NM"

      - name: Publicar artifact da release assinada
        uses: actions/upload-artifact@v4
        with:
          name: kenkern-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
